name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach confidential or licensed financial data. Use the synthetic demo files."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Start the app...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python, Node.js, browser"
    validations:
      required: true
  - type: textarea
    id: model_impact
    attributes:
      label: Financial-model impact
      description: Does this affect a valuation result, convention or only the UI?
