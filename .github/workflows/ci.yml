name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PERSISTENCE_BACKEND: memory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Audit optional desktop dependencies
        working-directory: apps/desktop
        run: npm audit --package-lock-only --audit-level=high
      - name: Validate desktop entry point
        working-directory: apps/desktop
        run: node --check main.js
      - run: docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag bondfx-api-ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag bondfx-web-ci .

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - run: python scripts/prepare_cloudflare.py
      - working-directory: deploy/cloudflare
        run: npm ci
      - working-directory: deploy/cloudflare
        run: npm exec wrangler -- deploy --dry-run
