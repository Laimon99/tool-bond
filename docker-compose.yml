services:
  api:
    container_name: tool-bond-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - API_SERVICE_NAME=tool-bond-api
      - API_SERVICE_VERSION=0.2.0
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      - MAX_IMPORT_FILES=10
      - MAX_IMPORT_FILE_BYTES=10000000
      - PERSISTENCE_BACKEND=memory
    restart: unless-stopped

  web:
    container_name: tool-bond-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
